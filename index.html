<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Капитал — проба</title>
<style>html,body{margin:0;height:100%;background:#f2f2f2}</style>
<script>
  // Wasm GC есть — грузим wasm, иначе запасная сборка на JS.
  const wasmGc = (() => { try { return WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,95,1,120,0])); } catch (e) { return false; } })();
  const s = document.createElement('script');
  s.src = wasmGc ? 'wasm/spike.js' : 'js/spike.js';
  document.head.appendChild(s);
</script>
</head>
<body></body>
</html>
